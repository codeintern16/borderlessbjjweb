<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教練團隊 | Broadless BJJ</title>
    
    <!-- 1. 全站通用樣式 -->
    <link rel="stylesheet" href="../css/index.css">
    
    <!-- 2. 「教練團隊」專屬獨立樣式 -->
    <link rel="stylesheet" href="../css/team.css">
</head>
<body>

    <!-- 1. 柔術棕帶 Header -->
    <header class="navbar">
        <div class="nav-container">
            
            <nav class="nav-links">
                <a href="../index.html">首頁</a>
                <a href="place.html">關於道館</a>
                <a href="courses.html">課程介紹</a>
                <a href="team.html" class="active">教練團隊</a>
            </nav>

            <a href="../index.html" class="nav-logo-center">
                <img src="../image/logo1.png" alt="Broadless BJJ Logo" style="height: 50px; width: auto;">
            </a>

            <div class="belt-black-sleeve">
                <a href="contact.html" class="btn-reserve">預約體驗</a>
                <div class="stripe-container">
                    <div class="stripe"></div>
                    <div class="stripe"></div>
                    <div class="stripe"></div>
                    <div class="stripe"></div>
                </div>
            </div>

        </div>
    </header>

    <!-- 2. 頁面頂部大黑 Banner (Hero Section) -->
    <section class="page-hero">
        <div class="hero-content">
            <h1 class="hero-title">INSTRUCTORS</h1>
            <p class="hero-subtitle">專業師資團隊</p>
        </div>
    </section>

    <!-- 3. 教練團隊展示區塊 -->
    <section class="coaches-section">
        <div class="container">
            <h2 class="coaches-main-title">MEET OUR TEAM <span>/ 教練介紹</span></h2>
            
            <div class="coaches-grid">
                
                <!-- 教練 1 -->
                <div class="coach-card">
                    <div class="coach-img-box">
                        <!-- 可以先放預設圖片，未來再換成教練照片 -->
                        <img src="../image/logo1.png" alt="總教練 Head Coach" class="coach-img">
                        <span class="coach-badge">BJJ COACH</span>
                    </div>
                    <div class="coach-info">
                        <h3 class="coach-name-zh">總教練 Name</h3>
                        <p class="coach-title-en">Head Coach / BJJ Brown Belt</p>
                        <ul class="coach-achievements">
                            <li>...</li>
                            <li>...</li>
                            <li>...</li>
                        </ul>
                    </div>
                </div>

                <!-- 教練 2 -->
                <div class="coach-card">
                    <div class="coach-img-box">
                        <img src="../image/logo1.png" alt="柔術教練 Coach" class="coach-img">
                        <span class="coach-badge">BJJ COACH</span>
                    </div>
                    <div class="coach-info">
                        <h3 class="coach-name-zh">柔術教練 Name</h3>
                        <p class="coach-title-en">BJJ Coach </p>
                        <ul class="coach-achievements">
                            <li>...</li>
                            <li>...</li>
                            <li>...</li>
                        </ul>
                    </div>
                </div>

                <!-- 教練 3 -->
                <div class="coach-card">
                    <div class="coach-img-box">
                        <img src="../image/logo1.png" alt="角力教練 Coach" class="coach-img">
                        <span class="coach-badge">WRESTLING COACH</span>
                    </div>
                    <div class="coach-info">
                        <h3 class="coach-name-zh">角力教練 Name</h3>
                        <p class="coach-title-en">Wrestling Coach</p>
                        <ul class="coach-achievements">
                            <li>...</li>
                            <li>...</li>
                            <li>...</li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- 4. 右下角快捷按鈕 (含 Top 按鈕) -->
    <div class="fab-container">
        <a href="https://open.spotify.com/show/1P2QQVMFtGvqf528ZZ8m6Z" target="_blank" class="fab-btn" title="Spotify Podcast">
            <img src="../image/mediaicon/spotify.png" alt="Spotify">
        </a>
        <a href="https://www.instagram.com/borderlessjiujitsu/" target="_blank" class="fab-btn" title="Instagram">
            <img src="../image/mediaicon/IG.png" alt="Instagram">
        </a>
        <a href="https://www.facebook.com/borderlessjiujitsu/?locale=zh_TW" target="_blank" class="fab-btn" title="Facebook">
            <img src="../image/mediaicon/FB.png" alt="Facebook">
        </a>
        <button id="backToTopBtn" class="fab-btn fab-top" title="回到頂部">
            <span>TOP</span>
        </button>
    </div>

    <!-- 5. 引入回到頂部 JS -->
    <script src="../javascript/rolltop.js"></script>

</body>
</html>
